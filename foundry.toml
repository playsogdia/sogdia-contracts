[profile.default]
src = "src"
test = "test"
out = "out"
libs = ["node_modules"]
solc_version = "0.8.30"
# OpenZeppelin 5.6 ERC1155 uses MCOPY, which needs the Cancun EVM target.
# SogdiaRewards keeps the Paris target it was first compiled and deployed with.
evm_version = "cancun"
additional_compiler_profiles = [{ name = "rewards-paris", evm_version = "paris" }]
compilation_restrictions = [{ paths = "src/SogdiaRewards.sol", evm_version = "paris" }]
optimizer = true
optimizer_runs = 200
remappings = ["@openzeppelin/contracts/=node_modules/@openzeppelin/contracts/"]
# script/CreateProducts.s.sol reads the price list it is given. The list is the operator's own file and
# is never committed, so the one directory it may be read from is the only filesystem access granted.
fs_permissions = [{ access = "read", path = "./products" }]

[profile.default.fuzz]
runs = 256
