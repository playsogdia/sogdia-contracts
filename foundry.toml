[profile.default]
src = "src"
test = "test"
out = "out"
libs = ["node_modules"]
solc_version = "0.8.30"
# OpenZeppelin 5.6 ERC1155 uses MCOPY, which needs the Cancun EVM target.
# SogdiaRewards keeps the Paris target it was first compiled and deployed with.
evm_version = "cancun"
additional_compiler_profiles = [{ name = "rewards-paris", evm_version = "paris" }]
compilation_restrictions = [{ paths = "src/SogdiaRewards.sol", evm_version = "paris" }]
optimizer = true
optimizer_runs = 200
remappings = ["@openzeppelin/contracts/=node_modules/@openzeppelin/contracts/"]

[profile.default.fuzz]
runs = 256
