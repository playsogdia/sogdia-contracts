name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  foundry:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.0

      - name: Build
        run: forge build --sizes

      - name: Test
        run: forge test -vvv
